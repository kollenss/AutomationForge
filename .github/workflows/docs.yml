name: Deploy docs to GitHub Pages

# Frozen 2026-06-25: the public docs site is a snapshot and no longer auto-deploys
# on push. The source of truth is in-repo (management/GAMEFORGE.md + CLAUDE.md).
# Run this workflow manually from the Actions tab if you ever want to rebuild it.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git-revision-date plugin if added later

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
