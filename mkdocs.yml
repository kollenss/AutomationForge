site_name: PropForge
site_description: No-code escape room hardware designer for Raspberry Pi
site_url: https://kollenss.github.io/AutomationForge/
repo_url: https://github.com/kollenss/AutomationForge
repo_name: kollenss/AutomationForge
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/overview.md
      - Hardware Service: architecture/hardware-service.md
      - Engine: architecture/engine.md
      - Modules Contract: architecture/modules.md
  - Getting Started:
      - Requirements: getting-started/requirements.md
      - Installation: getting-started/installation.md
      - First Project: getting-started/first-project.md
  - Hardware Modules:
      - Overview: hardware-modules/index.md
      - Relay Board: hardware-modules/relay.md
      - RFID Reader: hardware-modules/rfid.md
      - USB Device Detector: hardware-modules/usb-device-detector.md
  - Canvas:
      - Components: canvas/components.md
      - Wiring: canvas/wiring.md
      - Debug Mode: canvas/debug-mode.md
  - Advanced:
      - Custom Hardware Modules: advanced/custom-modules.md
      - Custom Logic Components: advanced/custom-logic.md
      - Floor Apps: advanced/game-apps.md
