<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>{{TITLE}}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #050505;
      --surface: #0f0f0f;
      --surface2:#161616;
      --border:  #222;
      --accent:  #c9a84c;
      --accent2: #e8c96a;
      --text:    #f0f0f0;
      --muted:   #555;
      --success: #22c55e;
      --error:   #ef4444;
      --radius:  14px;
      --glow:    0 0 24px rgba(201,168,76,0.15);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px 32px;
      gap: 28px;
    }

    /* ── Header ── */
    header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .logo {
      font-size: 2rem;
      filter: drop-shadow(0 0 12px rgba(201,168,76,0.5));
      margin-bottom: 4px;
    }
    header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 20px rgba(201,168,76,0.4);
    }
    header p {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: var(--glow), 0 4px 32px rgba(0,0,0,0.6);
    }

    /* ── Input ── */
    .input-wrap {
      position: relative;
    }
    textarea {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 14px 32px;
      font-size: 1.05rem;
      width: 100%;
      min-height: 90px;
      max-height: 200px;
      resize: none;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
      line-height: 1.6;
      caret-color: var(--accent);
    }
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(201,168,76,0.12);
    }
    textarea::placeholder { color: var(--muted); }
    .char-hint {
      position: absolute;
      bottom: 8px;
      right: 12px;
      font-size: 0.7rem;
      color: var(--muted);
      pointer-events: none;
      transition: color 0.2s;
    }
    .char-hint.warn { color: var(--accent); }

    /* ── Send button ── */
    .send-btn {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 16px;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      position: relative;
      overflow: hidden;
    }
    .send-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.08);
      opacity: 0;
      transition: opacity 0.15s;
    }
    .send-btn:active { transform: scale(0.97); }
    .send-btn:active::after { opacity: 1; }
    .send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    .send-btn.sending { background: var(--surface2); color: var(--accent); border: 1px solid var(--accent); }

    /* ── Status ── */
    .status {
      font-size: 0.82rem;
      text-align: center;
      min-height: 1.1em;
      letter-spacing: 0.04em;
      transition: opacity 0.3s;
    }
    .status.ok    { color: var(--success); }
    .status.error { color: var(--error); }
    .status.empty { opacity: 0; }

    /* ── Recent ── */
    .recent {
      width: 100%;
      max-width: 440px;
    }
    .recent-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding: 0 2px;
    }
    .recent-header span {
      font-size: 0.68rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      flex: 1;
    }
    .recent-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .recent-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 0.9rem;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      display: flex;
      align-items: center;
      gap: 10px;
      -webkit-tap-highlight-color: transparent;
    }
    .recent-item:active { background: var(--surface2); }
    .recent-item:hover  { border-color: var(--accent); color: var(--text); }
    .recent-item .ri-text {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .recent-item .ri-icon {
      font-size: 0.75rem;
      color: var(--muted);
      flex-shrink: 0;
    }
    .recent-item:hover .ri-icon { color: var(--accent); }
  </style>
</head>
<body>

  <header>
    <div class="logo">📡</div>
    <h1>{{TITLE}}</h1>
    <p>Secure transmission terminal</p>
  </header>

  <div class="card">
    <div class="input-wrap">
      <textarea id="txt" placeholder="{{PLACEHOLDER}}" rows="3" autofocus
        oninput="onInput()"></textarea>
      <span class="char-hint" id="charHint"></span>
    </div>
    <button class="send-btn" id="btn" onclick="sendText()">Transmit</button>
    <div class="status empty" id="status"></div>
  </div>

  <div class="recent" id="recentBox" style="display:none">
    <div class="recent-header">
      <span>Recent</span>
    </div>
    <div class="recent-list" id="recentList"></div>
  </div>

  <script>
    const INPUT_ID = new URLSearchParams(location.search).get('id') || '1';
    const MAX_RECENT = 5;
    const recentItems = [];

    function onInput() {
      const val = document.getElementById('txt').value;
      const hint = document.getElementById('charHint');
      if (val.length > 40) {
        hint.textContent = val.length;
        hint.className = 'char-hint warn';
      } else {
        hint.textContent = '';
        hint.className = 'char-hint';
      }
    }

    async function sendText() {
      const txt    = document.getElementById('txt');
      const btn    = document.getElementById('btn');
      const status = document.getElementById('status');
      const text   = txt.value.trim();
      if (!text) { shakeTxt(); return; }

      btn.disabled = true;
      btn.classList.add('sending');
      btn.textContent = 'Sending…';
      status.className = 'status empty';
      status.textContent = '';

      try {
        const res = await fetch('/submit', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({text, input_id: INPUT_ID}),
        });
        const data = await res.json();
        if (data.ok) {
          status.className = 'status ok';
          status.textContent = '✓ Transmitted';
          addRecent(text);
          txt.value = '';
          onInput();
          setTimeout(() => { status.className = 'status empty'; status.textContent = ''; }, 2500);
        } else {
          throw new Error('Server error');
        }
      } catch (e) {
        status.className = 'status error';
        status.textContent = '✗ Signal lost — check connection';
      } finally {
        btn.disabled = false;
        btn.classList.remove('sending');
        btn.textContent = 'Transmit';
      }
    }

    function shakeTxt() {
      const el = document.getElementById('txt');
      el.style.transition = 'transform 0.05s';
      const frames = [4, -4, 3, -3, 0];
      frames.forEach((x, i) =>
        setTimeout(() => el.style.transform = `translateX(${x}px)`, i * 50)
      );
      setTimeout(() => el.style.transition = '', 300);
    }

    function addRecent(text) {
      const idx = recentItems.indexOf(text);
      if (idx !== -1) recentItems.splice(idx, 1);
      recentItems.unshift(text);
      if (recentItems.length > MAX_RECENT) recentItems.length = MAX_RECENT;
      renderRecent();
    }

    function renderRecent() {
      const box  = document.getElementById('recentBox');
      const list = document.getElementById('recentList');
      box.style.display = recentItems.length ? '' : 'none';
      list.innerHTML = recentItems.map(t => {
        const safe = t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
        return `<div class="recent-item" onclick="reuseText(this.dataset.text)" data-text="${safe}">
          <span class="ri-text">${safe}</span>
          <span class="ri-icon">↑</span>
        </div>`;
      }).join('');
    }

    function reuseText(text) {
      const el = document.getElementById('txt');
      el.value = text;
      el.focus();
      onInput();
    }

    document.getElementById('txt').addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        sendText();
      }
    });
  </script>
</body>
</html>
